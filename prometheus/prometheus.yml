global:
  scrape_interval:     15s 
  evaluation_interval: 15s 

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: 'api'
    scrape_interval: 5s 
    metrics_path: '/metrics' 
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels:
          application: api

  - job_name: 'grafana'
    metrics_path: '/'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:4000']
